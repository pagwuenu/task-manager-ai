<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f3f7f5">
	<title>Tasks | Task Manager</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #1d302d;
			--muted: #71817d;
			--line: #e2eae6;
			--paper: #ffffff;
			--canvas: #f3f7f5;
			--green: #27745e;
			--green-dark: #1d5e4b;
			--mint: #e2f2eb;
			--coral: #e77e67;
			--shadow: 0 18px 48px rgba(37, 72, 59, 0.08);
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			background:
				radial-gradient(ellipse at 87% 4%, rgba(216, 238, 226, 0.68), transparent 29rem),
				repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(42, 91, 71, 0.025) 40px),
				var(--canvas);
			color: var(--ink);
			font-family: "DM Sans", sans-serif;
		}

		button, input { font: inherit; }

		.topbar {
			height: 72px;
			border-bottom: 1px solid rgba(226, 234, 230, 0.85);
			background: rgba(255, 255, 255, 0.78);
		}

		.topbar-inner {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: min(100% - 48px, 1080px);
			height: 100%;
			margin: 0 auto;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 11px;
			color: var(--ink);
			font-family: "Manrope", sans-serif;
			font-size: 15px;
			font-weight: 800;
			letter-spacing: 0;
			text-decoration: none;
		}

		.brand-mark {
			display: grid;
			width: 31px;
			height: 31px;
			place-items: center;
			border-radius: 9px;
			background: var(--green);
			color: white;
		}

		.brand-mark svg { width: 17px; height: 17px; }

		.local-status {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			color: var(--muted);
			font-size: 12px;
			font-weight: 600;
		}

		.status-dot {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: #48a27a;
			box-shadow: 0 0 0 3px #e4f3eb;
		}

		main {
			width: min(100% - 48px, 820px);
			margin: 0 auto;
			padding: 66px 0 80px;
			animation: arrive 420ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 11px;
			color: var(--green);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.2px;
			text-transform: uppercase;
		}

		.heading-row {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 31px;
		}

		h1 {
			margin: 0;
			font-family: "Manrope", sans-serif;
			font-size: 39px;
			font-weight: 700;
			letter-spacing: 0;
			line-height: 1.15;
		}

		.date-label {
			margin: 10px 0 0;
			color: var(--muted);
			font-size: 14px;
		}

		.progress-note {
			flex: 0 0 auto;
			padding-bottom: 3px;
			color: var(--muted);
			font-size: 13px;
		}

		.progress-note strong { color: var(--ink); font-weight: 700; }

		.composer {
			display: flex;
			gap: 10px;
			padding: 9px;
			border: 1px solid #dce8e1;
			border-radius: 12px;
			background: var(--paper);
			box-shadow: var(--shadow);
		}

		.composer input {
			width: 100%;
			min-width: 0;
			height: 46px;
			padding: 0 14px;
			border: 0;
			outline: 0;
			background: transparent;
			color: var(--ink);
			font-size: 14px;
		}

		.composer input::placeholder { color: #9aa8a3; }

		.composer:focus-within {
			border-color: #82b8a1;
			box-shadow: 0 0 0 3px rgba(39, 116, 94, 0.11), var(--shadow);
		}

		.add-button {
			display: inline-flex;
			flex: 0 0 auto;
			align-items: center;
			justify-content: center;
			gap: 8px;
			min-width: 111px;
			height: 46px;
			padding: 0 16px;
			border: 0;
			border-radius: 8px;
			background: var(--green);
			color: white;
			cursor: pointer;
			font-size: 13px;
			font-weight: 700;
			transition: background 150ms ease, transform 150ms ease;
		}

		.add-button:hover { background: var(--green-dark); }
		.add-button:active { transform: translateY(1px); }
		.add-button svg { width: 16px; height: 16px; }

		.list-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			margin-top: 37px;
			padding-bottom: 13px;
			border-bottom: 1px solid var(--line);
		}

		.list-toolbar h2 {
			margin: 0;
			font-family: "Manrope", sans-serif;
			font-size: 15px;
			font-weight: 700;
		}

		.filters {
			display: inline-flex;
			gap: 3px;
			padding: 3px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.62);
		}

		.filter-button {
			min-height: 29px;
			padding: 0 10px;
			border: 0;
			border-radius: 5px;
			background: transparent;
			color: var(--muted);
			cursor: pointer;
			font-size: 11px;
			font-weight: 600;
		}

		.filter-button[aria-pressed="true"] {
			background: white;
			color: var(--green-dark);
			box-shadow: 0 1px 3px rgba(26, 59, 47, 0.12);
		}

		.task-list {
			display: grid;
			gap: 9px;
			margin: 15px 0 0;
			padding: 0;
			list-style: none;
		}

		.task-list[hidden], .empty-state[hidden] { display: none; }

		.task-item {
			display: flex;
			align-items: center;
			gap: 14px;
			min-height: 68px;
			padding: 13px 15px;
			border: 1px solid var(--line);
			border-radius: 9px;
			background: rgba(255, 255, 255, 0.92);
			animation: arrive 220ms ease-out both;
		}

		.task-check {
			display: grid;
			flex: 0 0 20px;
			width: 20px;
			height: 20px;
			place-items: center;
			padding: 0;
			border: 1.5px solid #bccbc4;
			border-radius: 6px;
			background: white;
			color: white;
			cursor: pointer;
			transition: background 140ms ease, border-color 140ms ease;
		}

		.task-check:hover { border-color: var(--green); }
		.task-check svg { width: 13px; height: 13px; opacity: 0; }
		.task-item.is-complete .task-check { border-color: var(--green); background: var(--green); }
		.task-item.is-complete .task-check svg { opacity: 1; }

		.task-copy { flex: 1; min-width: 0; }

		.task-title {
			overflow-wrap: anywhere;
			color: var(--ink);
			font-size: 14px;
			font-weight: 600;
			line-height: 1.4;
		}

		.task-description {
			margin: 3px 0 0;
			overflow-wrap: anywhere;
			color: var(--muted);
			font-size: 12px;
			line-height: 1.45;
		}

		.task-item.is-complete .task-title {
			color: #87958f;
			text-decoration: line-through;
			text-decoration-color: #a7b5af;
		}

		.delete-button {
			display: grid;
			flex: 0 0 32px;
			width: 32px;
			height: 32px;
			place-items: center;
			border: 0;
			border-radius: 7px;
			background: transparent;
			color: #96a39d;
			cursor: pointer;
			opacity: 0.68;
			transition: background 140ms ease, color 140ms ease, opacity 140ms ease;
		}

		.delete-button:hover { background: #fff0ed; color: #bd5a46; opacity: 1; }
		.delete-button svg { width: 16px; height: 16px; }

		.empty-state {
			display: grid;
			min-height: 190px;
			place-content: center;
			justify-items: center;
			margin-top: 15px;
			border: 1px dashed #d4e1da;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.45);
			text-align: center;
		}

		.empty-icon {
			display: grid;
			width: 42px;
			height: 42px;
			place-items: center;
			margin-bottom: 12px;
			border-radius: 13px;
			background: var(--mint);
			color: var(--green);
		}

		.empty-icon svg { width: 20px; height: 20px; }
		.empty-state strong { font-family: "Manrope", sans-serif; font-size: 14px; }
		.empty-state p { margin: 5px 16px 0; color: var(--muted); font-size: 12px; }
		.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(7px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}

		@media (max-width: 560px) {
			.topbar { height: 62px; }
			.topbar-inner, main { width: min(100% - 32px, 820px); }
			main { padding-top: 45px; }
			h1 { font-size: 33px; }
			.heading-row { align-items: flex-start; flex-direction: column; gap: 12px; margin-bottom: 24px; }
			.progress-note { padding-bottom: 0; }
			.composer { gap: 5px; }
			.composer input { padding: 0 9px; font-size: 13px; }
			.add-button { min-width: 47px; width: 47px; padding: 0; }
			.add-button span { display: none; }
			.list-toolbar { align-items: flex-start; flex-direction: column; gap: 11px; margin-top: 29px; }
			.filter-button { padding: 0 12px; }
			.task-item { gap: 11px; padding: 12px; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<div class="topbar-inner">
			<a class="brand" href="#" aria-label="Task Manager home">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 20 20" fill="none"><path d="m4.5 10.2 3.4 3.4 7.6-7.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</span>
				<span>Task Manager</span>
			</a>
			<span class="local-status"><span class="status-dot" aria-hidden="true"></span>Saved in this browser</span>
		</div>
	</header>

	<main>
		<p class="eyebrow">Your workspace</p>
		<div class="heading-row">
			<div>
				<h1>Tasks</h1>
				<p class="date-label" id="today-date"></p>
			</div>
			<p class="progress-note" id="progress-note" aria-live="polite"></p>
		</div>

		<form class="composer" id="task-form">
			<label class="visually-hidden" for="task-title">Task name</label>
			<input id="task-title" name="title" type="text" placeholder="Add a task..." maxlength="160" autocomplete="off" required>
			<button class="add-button" type="submit" aria-label="Add task">
				<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
				<span>Add task</span>
			</button>
		</form>

		<section aria-labelledby="list-heading">
			<div class="list-toolbar">
				<h2 id="list-heading">Your list</h2>
				<div class="filters" role="group" aria-label="Filter tasks">
					<button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
					<button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
					<button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
				</div>
			</div>
			<ul class="task-list" id="task-list" aria-live="polite"></ul>
			<div class="empty-state" id="empty-state">
				<span class="empty-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none"><path d="M7 4.75h10a2 2 0 0 1 2 2v12.5H5V6.75a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
				</span>
				<strong id="empty-title">A clear list, a fresh start</strong>
				<p id="empty-copy">Add a task above to get started.</p>
			</div>
		</section>
	</main>

	<script>
		const STORAGE_KEY = 'task-manager.tasks';
		const form = document.querySelector('#task-form');
		const titleInput = document.querySelector('#task-title');
		const taskList = document.querySelector('#task-list');
		const emptyState = document.querySelector('#empty-state');
		const progressNote = document.querySelector('#progress-note');
		const filterButtons = document.querySelectorAll('.filter-button');
		let activeFilter = 'all';
		let tasks = loadTasks();

		document.querySelector('#today-date').textContent = new Intl.DateTimeFormat(undefined, {
			weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
		}).format(new Date());

		function loadTasks() {
			try {
				const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
				return Array.isArray(saved) ? saved.filter((task) => task && typeof task.title === 'string') : [];
			} catch {
				return [];
			}
		}

		function saveTasks() {
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
			} catch {
				progressNote.textContent = 'Could not save changes in this browser';
			}
		}

		function makeIcon(markup) {
			const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
			icon.setAttribute('viewBox', '0 0 20 20');
			icon.setAttribute('fill', 'none');
			icon.innerHTML = markup;
			return icon;
		}

		function render() {
			const completedCount = tasks.filter((task) => task.completed).length;
			const visibleTasks = tasks.filter((task) => {
				if (activeFilter === 'active') return !task.completed;
				if (activeFilter === 'completed') return task.completed;
				return true;
			});

			progressNote.innerHTML = `<strong>${completedCount}</strong> of <strong>${tasks.length}</strong> completed`;
			taskList.replaceChildren();
			emptyState.hidden = visibleTasks.length > 0;
			taskList.hidden = visibleTasks.length === 0;

			if (tasks.length > 0 && visibleTasks.length === 0) {
				document.querySelector('#empty-title').textContent = 'Nothing in this view';
				document.querySelector('#empty-copy').textContent = 'Try another filter to see your tasks.';
			} else {
				document.querySelector('#empty-title').textContent = 'A clear list, a fresh start';
				document.querySelector('#empty-copy').textContent = 'Add a task above to get started.';
			}

			for (const task of visibleTasks) {
				const item = document.createElement('li');
				item.className = `task-item${task.completed ? ' is-complete' : ''}`;

				const checkButton = document.createElement('button');
				checkButton.className = 'task-check';
				checkButton.type = 'button';
				checkButton.setAttribute('aria-label', task.completed ? `Mark ${task.title} active` : `Complete ${task.title}`);
				checkButton.setAttribute('aria-pressed', String(task.completed));
				checkButton.append(makeIcon('<path d="m4.5 10.2 3.4 3.4 7.6-7.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'));
				checkButton.addEventListener('click', () => {
					task.completed = !task.completed;
					saveTasks();
					render();
				});

				const copy = document.createElement('div');
				copy.className = 'task-copy';
				const title = document.createElement('div');
				title.className = 'task-title';
				title.textContent = task.title;
				copy.append(title);

				const removeButton = document.createElement('button');
				removeButton.className = 'delete-button';
				removeButton.type = 'button';
				removeButton.setAttribute('aria-label', `Delete ${task.title}`);
				removeButton.title = 'Delete task';
				removeButton.append(makeIcon('<path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.6 9.5h-7L6.3 6m2.4 2.5v4.5m2.6-4.5v4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'));
				removeButton.addEventListener('click', () => {
					tasks = tasks.filter((entry) => entry.id !== task.id);
					saveTasks();
					render();
				});

				item.append(checkButton, copy, removeButton);
				taskList.append(item);
			}
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const title = titleInput.value.trim();
			if (!title) {
				titleInput.focus();
				return;
			}

			tasks.unshift({
				id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
				title,
				completed: false,
				createdAt: new Date().toISOString()
			});
			activeFilter = 'all';
			filterButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter)));
			saveTasks();
			form.reset();
			render();
			titleInput.focus();
		});

		filterButtons.forEach((button) => {
			button.addEventListener('click', () => {
				activeFilter = button.dataset.filter;
				filterButtons.forEach((filter) => filter.setAttribute('aria-pressed', String(filter === button)));
				render();
			});
		});

		render();
	</script>
</body>
</html>
